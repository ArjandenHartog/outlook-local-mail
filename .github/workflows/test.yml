name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r bridge/requirements.txt
      - name: Unit tests (fakes only, no Outlook or mailbox needed)
        working-directory: bridge
        run: python -m unittest discover -p "test_*.py"
      - name: No personal data or secrets committed
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(runtime/|accounts\.json|imap-accounts\.json|signature-settings\.json)|\.dpapi$|\.sqlite3'; then
            echo "private file tracked"; exit 1; fi
